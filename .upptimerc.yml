# Upptime (https://upptime.js.org) — CommonNote 상태 페이지 설정
owner: JAEYOONSUNG
repo: commonnote-status

sites:
  - name: CommonNote API
    url: https://commonnote.app/api/health
    expectedStatusCodes: [200]
  - name: CommonNote Collaboration
    url: https://commonnote.app/collab/health
    expectedStatusCodes: [200]
  - name: CommonNote Downloads
    url: https://commonnote.app/downloads/latest.json
    expectedStatusCodes: [200]

status-website:
  cname: ""
  baseUrl: /commonnote-status
  logoUrl: https://jaeyoonsung.github.io/commonnote-status/assets/favicon.svg
  name: CommonNote 상태
  introTitle: "**CommonNote** 서비스 가동 상태"
  introMessage: 웹·API, 실시간 편집 서버, 앱 업데이트 배포의 외부 감시 기록입니다. GitHub Actions 실행은 지연될 수 있으며 5분 이내 점검을 보장하지 않습니다. 사용자용 상태 화면은 별도 CommonNote Status Pages 작업으로 배포됩니다.
  navbar:
    - title: 상태
      href: https://jaeyoonsung.github.io/commonnote-status/
    - title: 장애 이력
      href: https://github.com/JAEYOONSUNG/commonnote-status/issues?q=is%3Aissue+label%3Astatus
    - title: CommonNote
      href: https://commonnote.app

